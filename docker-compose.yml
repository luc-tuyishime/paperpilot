# Two ways to run:
#   Everything in Docker:   docker compose up --build
#   Dev mode (recommended): docker compose up -d postgres qdrant
#                           then run the API on your Mac with `uv run uvicorn ... --reload`
#
# Ollama is NOT in Docker: it runs natively on your Mac (faster, uses Apple's GPU).
# Containers reach it at host.docker.internal.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paperpilot
      POSTGRES_PASSWORD: paperpilot
      POSTGRES_DB: paperpilot
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # REST API + dashboard at http://localhost:6333/dashboard
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PAPERPILOT_ENVIRONMENT: docker
      PAPERPILOT_DATABASE_URL: postgresql+psycopg://paperpilot:paperpilot@postgres:5432/paperpilot
      PAPERPILOT_QDRANT_URL: http://qdrant:6333
      PAPERPILOT_OLLAMA_URL: http://host.docker.internal:11434
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
  qdrant_data:
  uploads:
