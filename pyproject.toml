[project]
name = "paperpilot"
version = "0.3.0"
description = "An AI assistant that answers questions about research papers, with cited sources."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.20.1",
    "qdrant-client>=1.12",
    "pypdf>=6.21.4",
    "httpx>=0.28.1",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",   # FastAPI's TestClient uses httpx under the hood
    "ruff>=0.6",
    "mypy>=1.11",
    "fpdf2>=2.9.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]  # generated code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # errors, pyflakes, import order, modern syntax, bugbear

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
